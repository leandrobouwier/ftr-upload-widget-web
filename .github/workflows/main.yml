name: Deploy to s3

on:
  push:
    branches:
      - main
env:
    AWS_S3_BUCKET_ESTATICO: 'rocketseat-upload-widget-web-estatico'
    AWS_S3_BUCKET_CDL:  'rocketset-upload-widget-web-cdl'
    SOURCE_DIST: './dist'


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Configure node
        id: configure-node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        id: install-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        id: install-dependencies
        run: |
          pnpm install

      - name: Build app
        id: build-app
        run: |
          pnpm run build

      - name: Configure AWS credentials
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync files to S3 estatico
        id: sync-files-to-s3-estatico
        run: |
            aws s3 sync ${{ env.SOURCE_DIST }} s3://${{ env.AWS_S3_BUCKET_ESTATICO }}/ --delete --exclude '.*git*'

      - name: Sync files to S3 CDL
        id: sync-files-to-s3-cdl
        run: |
            aws s3 sync ${{ env.SOURCE_DIST }} s3://${{ env.AWS_S3_BUCKET_CDL }}/ --delete --exclude '.*git*'